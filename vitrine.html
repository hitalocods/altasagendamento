<!-- Vitrine do Profissional / Salão -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="pageTitle">Atlas Agendamento — Vitrine Exclusiva</title>
  <meta name="description" id="pageDescription" content="Beleza e cuidado que respeitam o seu tempo e a sua história." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #120e0c;
      --bg-card: rgba(30, 22, 19, 0.75);
      --bg-glass: rgba(255, 255, 255, 0.05);
      
      --pearly-white: #F9F6F1;
      --blush-pink: #E1C1B6;
      --blush-glow: rgba(225, 193, 182, 0.32);
      --blush-soft: rgba(225, 193, 182, 0.12);
      --champagne-gold: #D6BD9F;
      --champagne-light: #EAD8C3;
      --champagne-dark: #B59B79;
      --champagne-glow: rgba(214, 189, 159, 0.35);
      
      --cream: #F9F6F1;
      --cream-soft: #E3D8CC;
      --cream-muted: rgba(249, 246, 241, 0.72);
      --gold: #D6BD9F;
      --gold-light: #EAD8C3;
      --gold-dark: #B59B79;
      --gold-glow: rgba(214, 189, 159, 0.3);
      --border-glass: rgba(225, 193, 182, 0.14);
      --border-gold: rgba(214, 189, 159, 0.38);
      --border-blush: rgba(225, 193, 182, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      background: radial-gradient(circle at 75% 25%, #352620 0%, #1c1512 45%, #120e0c 100%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--pearly-white);
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-tenant-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px clamp(16px, 4vw, 32px);
      background: rgba(18, 14, 12, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(214, 189, 159, 0.15);
    }

    .platform-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--cream);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .platform-logo span {
      background: linear-gradient(135deg, var(--champagne-gold), var(--blush-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-action-pill {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-gold);
      color: var(--champagne-light);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn-action-pill:hover {
      background: rgba(214, 189, 159, 0.18);
      border-color: var(--champagne-gold);
      color: #fff;
    }

    .ambient-orb-1 {
      position: fixed;
      top: 5%;
      right: 10%;
      width: clamp(280px, 45vw, 520px);
      height: clamp(280px, 45vw, 520px);
      background: radial-gradient(circle, rgba(214, 189, 159, 0.2) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
    }

    .ambient-orb-2 {
      position: fixed;
      bottom: 5%;
      left: 5%;
      width: clamp(240px, 35vw, 420px);
      height: clamp(240px, 35vw, 420px);
      background: radial-gradient(circle, rgba(225, 193, 182, 0.18) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
    }

    .hero-container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 1240px;
      margin: 0 auto;
      padding: clamp(70px, 12vh, 90px) clamp(16px, 4vw, 36px) 24px;
      width: 100%;
    }

    @media (min-width: 900px) {
      .hero-container {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: clamp(32px, 5vw, 64px);
      }
    }

    .content-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 580px;
    }

    @media (min-width: 900px) {
      .content-area {
        align-items: flex-start;
        text-align: left;
      }
    }

    .top-badge {
      order: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      margin-bottom: 16px;
    }

    .top-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--champagne-gold);
      box-shadow: 0 0 8px var(--champagne-gold);
    }

    .top-badge-text {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--champagne-light);
      font-weight: 600;
    }

    .title-first {
      order: 2;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(44px, 11vw, 68px);
      line-height: 0.95;
      color: var(--cream);
      letter-spacing: -0.01em;
      text-align: center;
      position: relative;
      z-index: 3;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
    }

    .title-last {
      order: 4;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: clamp(40px, 10vw, 62px);
      line-height: 1;
      color: var(--champagne-light);
      letter-spacing: 0.02em;
      text-align: center;
      position: relative;
      z-index: 3;
      margin-bottom: 20px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.85);
    }

    @media (min-width: 900px) {
      .title-first {
        order: 2;
        text-align: left;
        margin-bottom: 0;
      }
      .title-last {
        order: 3;
        text-align: left;
        margin-top: 0;
        margin-bottom: 24px;
      }
    }

    .hero-text {
      order: 5;
      font-size: clamp(14px, 3.5vw, 16px);
      color: var(--cream-muted);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: clamp(20px, 4vw, 32px);
      font-weight: 300;
    }

    .btn-group {
      order: 6;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: 100%;
      margin-bottom: 24px;
    }

    @media (min-width: 900px) {
      .btn-group {
        justify-content: flex-start;
      }
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pill-btn-primary {
      background: linear-gradient(135deg, #E1C1B6 0%, #D6BD9F 50%, #B59B79 100%);
      color: #1A120E;
      box-shadow: 0 10px 25px rgba(214, 189, 159, 0.35);
      border: none;
    }

    .pill-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(225, 193, 182, 0.45);
    }

    .pill-btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-gold);
      color: var(--cream);
    }

    .specialty-chips {
      order: 7;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    @media (min-width: 900px) {
      .specialty-chips {
        justify-content: flex-start;
      }
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(225, 193, 182, 0.16);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 11px;
      color: var(--champagne-light);
      letter-spacing: 0.04em;
    }

    .photo-area {
      order: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: clamp(240px, 60vw, 320px);
      margin: 12px auto 20px;
      z-index: 2;
    }

    @media (min-width: 900px) {
      .photo-area {
        order: 2;
        max-width: 380px;
        margin: 0;
      }
    }

    .photo-halo {
      position: absolute;
      inset: -15px;
      background: radial-gradient(circle, rgba(214, 189, 159, 0.25) 0%, transparent 70%);
      filter: blur(30px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .arch-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      border-radius: clamp(140px, 35vw, 190px) clamp(140px, 35vw, 190px) 24px 24px;
      overflow: hidden;
      background: #251b15;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.85), 0 0 25px rgba(214, 189, 159, 0.18);
      border: 1px solid rgba(214, 189, 159, 0.35);
      aspect-ratio: 3.4 / 4.3;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.6s ease;
    }

    .arch-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .arch-gradient-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 65%, rgba(18, 14, 11, 0.85) 100%);
      pointer-events: none;
    }

    .photo-floating-pill {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: rgba(18, 14, 12, 0.85);
      border: 1px solid var(--border-gold);
      border-radius: 9999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 2;
    }

    .photo-pill-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--cream);
    }

    .photo-pill-sub {
      font-size: 10px;
      color: var(--champagne-light);
      letter-spacing: 0.05em;
    }

    .photo-pill-arrow {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--champagne-gold);
      color: #120e0c;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 12px;
    }

    /* Modal Sobre Mim */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 14, 12, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: rgba(28, 20, 16, 0.98);
      border: 1px solid var(--border-gold);
      border-radius: clamp(24px, 5vw, 36px);
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: clamp(24px, 5vw, 36px);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--cream-soft);
      font-size: 15px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    .modal-body {
      font-size: 14px;
      color: var(--cream-soft);
      line-height: 1.7;
      margin-bottom: 20px;
      font-weight: 300;
    }

    footer {
      margin-top: auto;
      padding: 20px 0;
      text-align: center;
      z-index: 10;
      position: relative;
    }

    footer a {
      font-size: 11px;
      color: var(--cream-muted);
      text-decoration: none;
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    footer a:hover {
      opacity: 1;
      color: var(--champagne-gold);
    }
  </style>
</head>

<body>
  <header class="top-tenant-bar">
    <a href="/" class="platform-logo">
      <span>✦ ATLAS AGENDAMENTO</span>
    </a>

    <div>
      <a href="/" class="btn-action-pill">
        ← Conhecer a Plataforma Atlas
      </a>
      <a href="admin.html" id="topLinkAdmin" class="btn-action-pill" style="margin-left: 6px;">
        ⚙️ Gestão
      </a>
    </div>
  </header>

  <div class="ambient-orb-1"></div>
  <div class="ambient-orb-2"></div>

  <div class="hero-container">
    <main class="content-area">
      <div class="top-badge">
        <div class="top-badge-dot"></div>
        <span class="top-badge-text" id="tenantTagline">Atendimento Exclusivo</span>
      </div>

      <h1 class="title-first" id="tenantTitleFirst">Studio</h1>
      <div class="title-last" id="tenantTitleLast">Beauty</div>

      <p class="hero-text" id="tenantDescription">
        Beleza e cuidado que respeitam o seu tempo e a sua história.
      </p>

      <div class="btn-group">
        <a href="agendamento.html" class="pill-btn pill-btn-primary" id="btnAgendar">
          Agendar Horário
        </a>
        <button type="button" class="pill-btn pill-btn-secondary" id="btnSobre" onclick="openAboutModal()">
          Quem Sou Eu
        </button>
      </div>

      <div class="specialty-chips" id="tenantSpecialties"></div>
    </main>

    <aside class="photo-area">
      <div class="photo-halo"></div>
      <div class="arch-frame">
        <img id="tenantPrimaryPhoto" src="img/geovana_clean.webp" alt="Foto do Profissional" class="arch-img" />
        <div class="arch-gradient-mask"></div>

        <div class="photo-floating-pill">
          <div>
            <div class="photo-pill-title" id="pillTitle">Profissional</div>
            <div class="photo-pill-sub" id="pillSub">Beauty & Style</div>
          </div>
          <a href="agendamento.html" class="photo-pill-arrow" id="pillArrow">→</a>
        </div>
      </div>
    </aside>
  </div>

  <footer>
    <a href="admin.html" id="linkAdmin">
      ✦ Painel de Gestão do Negócio
    </a>
  </footer>

  <div class="modal-overlay" id="modalAbout" onclick="handleBackdropClick(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAboutModal()">✕</button>
      <div class="top-badge" style="margin-bottom: 12px;">
        <div class="top-badge-dot"></div>
        <span class="top-badge-text">Sobre a Artista</span>
      </div>
      <h2 class="modal-title" id="aboutModalTitle">Profissional</h2>
      <p class="modal-body" id="aboutModalBody"></p>
      <div class="specialty-chips" id="aboutModalChips" style="margin-bottom: 24px;"></div>
      <a href="agendamento.html" class="pill-btn pill-btn-primary" id="btnAboutBook" style="width: 100%;">
        Escolher Meu Horário
      </a>
    </div>
  </div>

  <script>
    function getUrlTenantSlug() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('tenant')) return params.get('tenant');
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts[0] === 'p' && pathParts[1]) return pathParts[1];
      return localStorage.getItem('last_atlas_tenant') || 'studio-lumina';
    }

    async function loadTenant(slug) {
      try {
        const res = await fetch(`/api/tenants/${encodeURIComponent(slug)}`);
        const json = await res.json();
        if (json.success && json.data) {
          applyTenant(json.data);
        }
      } catch (e) { console.warn(e); }
    }

    function applyTenant(t) {
      document.getElementById('pageTitle').textContent = t.business_name;
      document.getElementById('tenantTagline').textContent = t.tagline || 'Atendimento Exclusivo';
      document.getElementById('tenantTitleFirst').textContent = t.title_first || '';
      document.getElementById('tenantTitleLast').textContent = t.title_last || '';
      document.getElementById('tenantDescription').textContent = t.description || '';
      
      if (t.primary_photo) {
        document.getElementById('tenantPrimaryPhoto').src = t.primary_photo;
      }
      
      const fullName = `${t.title_first || ''} ${t.title_last || ''}`.trim() || t.business_name;
      document.getElementById('pillTitle').textContent = fullName;
      document.getElementById('pillSub').textContent = t.tagline || 'Beauty Artist';

      const bookUrl = `agendamento.html?tenant=${encodeURIComponent(t.slug)}`;
      document.getElementById('btnAgendar').href = bookUrl;
      document.getElementById('pillArrow').href = bookUrl;
      document.getElementById('btnAboutBook').href = bookUrl;
      document.getElementById('linkAdmin').href = `admin.html?tenant=${encodeURIComponent(t.slug)}`;
      document.getElementById('topLinkAdmin').href = `admin.html?tenant=${encodeURIComponent(t.slug)}`;

      const specs = Array.isArray(t.specialties) ? t.specialties : [];
      const chipsHtml = specs.map(s => `<div class="chip">✦ ${s}</div>`).join('');
      document.getElementById('tenantSpecialties').innerHTML = chipsHtml;
      document.getElementById('aboutModalChips').innerHTML = chipsHtml;

      document.getElementById('aboutModalTitle').textContent = fullName;
      document.getElementById('aboutModalBody').textContent = t.about_text || t.description || '';
    }

    function openAboutModal() {
      document.getElementById('modalAbout').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeAboutModal() {
      document.getElementById('modalAbout').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modalAbout') closeAboutModal();
    }

    loadTenant(getUrlTenantSlug());
  </script>
</body>
</html>
